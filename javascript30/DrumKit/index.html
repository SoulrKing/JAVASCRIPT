<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drumkit</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="keys">
    <div data-key="65" class="key">
      <kbd>A</kbd>
      <span class="sound">clap</span>
    </div>
    <div data-key="83" class="key">
      <kbd>S</kbd>
      <span class="sound">hihat</span>
    </div>
    <div data-key="68" class="key">
      <kbd>D</kbd>
      <span class="sound">kick</span>
    </div>
    <div data-key="70" class="key">
      <kbd>F</kbd>
      <span class="sound">openhat</span>
    </div>
    <div data-key="71" class="key">
      <kbd>G</kbd>
      <span class="sound">boom</span>
    </div>
    <div data-key="72" class="key">
      <kbd>H</kbd>
      <span class="sound">ride</span>
    </div>
    <div data-key="74" class="key">
      <kbd>J</kbd>
      <span class="sound">snare</span>
    </div>
    <div data-key="75" class="key">
      <kbd>K</kbd>
      <span class="sound">tom</span>
    </div>
    <div data-key="76" class="key">
      <kbd>L</kbd>
      <span class="sound">tink</span>
    </div>
  </div>

  <audio data-key="65" src="sounds/clap.wav"></audio>
  <audio data-key="83" src="sounds/hihat.wav"></audio>
  <audio data-key="68" src="sounds/kick.wav"></audio>
  <audio data-key="70" src="sounds/openhat.wav"></audio>
  <audio data-key="71" src="sounds/boom.wav"></audio>
  <audio data-key="72" src="sounds/ride.wav"></audio>
  <audio data-key="74" src="sounds/snare.wav"></audio>
  <audio data-key="75" src="sounds/tom.wav"></audio>
  <audio data-key="76" src="sounds/tink.wav"></audio>

  <script>
   function playsom(e) {
      // console.log(e.keyCode) teste isso dps para aprender sobre codigos de teclas do teclado que e bastante interessante
      const audio = document.querySelector(`audio[data-key="${e.keyCode}"]`) // query selector da function {e}
      const key = document.querySelector(`.key[data-key="${e.keyCode}"]`) // query selector da function {e}
      if (!audio) return // isso faz a função nao tocar tudo junto
      audio.currentTime = 0 /* ajusta o tempo de atuaÇÃO para ativar outra tecla ou seja, 
      enquanto voce tiver apertando o "a" ele toca por cima do "a" que voce tocou, fazendo que voce não precisa esperar para apertar o "a" dnv*/
      audio.play()
      key.classList.add("playing")
    }

    function removeTrasition(e) {
      if (e.propertyName !== "transform") return // pule isso caso nao seja um transform

      // console.log(this) //"this" e igual a ultima coisa que foi chamado com por exemplo o key.addEventListener(que e o que esta no scopo global)

      this.classList.remove("playing")
    }

    const keys = document.querySelectorAll('.key')
    keys.forEach(key => key.addEventListener("transitionend", removeTrasition))
    window.addEventListener('keydown',playsom) 
  </script>

</body>

</html>
