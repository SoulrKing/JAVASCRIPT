<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>JS + CSS Clock</title>
    <link rel="icon" href="https://fav.farm/🔥" />
    <style>
        html {
            background: #07c026 url(https://unsplash.it/1500/1000?image=881&blur=5);
            background-size: cover;
            font-family: 'helvetica neue';
            text-align: center;
            font-size: 10px;
        }

        body {
            margin: 0;
            font-size: 2rem;
            display: flex;
            flex: 1;
            min-height: 100vh;
            align-items: center;
        }

        .clock {
            width: 300px;
            height: 300px;
            border: 20px solid white;
            border-radius: 50%;
            margin: 50px auto;
            position: relative;
            padding: 2rem;
            box-shadow:
                0 0 0 4px rgba(0, 0, 0, 0.1),
                inset 0 0 0 3px #EFEFEF,
                inset 0 0 10px black,
                0 0 10px rgba(0, 0, 0, 0.2);
        }

        .clock-face {
            position: relative;
            width: 100%;
            height: 100%;
            transform: translateY(-3px);
        }

        .hand {
            width: 50%;
            height: 6px;
            background: black;
            position: absolute;
            top: 50%;
            transform-origin: 100%;
            transform: rotate(90deg);
            transition: all 0.5s;
        }

      
    </style>
</head>

<body>
    <div class="clock">
        <div class="clock-face" id="clockFace">
            <div class="hand hour-hand"></div>
            <div class="hand min-hand"></div>
            <div class="hand second-hand"></div>
        </div>
    </div>

    <script>
        const segundamao = document.querySelector('.second-hand');
        const horamao = document.querySelector('.hour-hand');
        const minutomao = document.querySelector('.min-hand');

        function setdata() {
            const agora = new Date();
            const segundos = agora.getSeconds();
            const segundosgraus = ((segundos / 60) * 360) + 90;
            segundamao.style.transform = `rotate(${segundosgraus}deg)`;

            const minutos = agora.getMinutes();
            const minutosgraus = ((minutos / 60) * 360) + 90;
            minutomao.style.transform = `rotate(${minutosgraus}deg)`;

            const horas = agora.getHours();
            const horasgraus = ((horas / 12) * 360) + 90; // Corrigido para 12 horas
            horamao.style.transform = `rotate(${horasgraus}deg)`;
        }

        setInterval(setdata, 1000);

    </script>
</body>
</html>
